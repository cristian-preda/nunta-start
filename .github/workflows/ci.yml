name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Doar Postgres: restul serviciilor se adaugă când au nevoie testele (Realtime, Auth, E2E).
      - run: npx supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db reset
      - run: npx supabase test db
      # Erori de schemă și de plpgsql (nu avertismente): CI pică doar la nivel `error`.
      - run: npx supabase db lint --local --level error --fail-on error
      - run: npm run db:types
      - name: Check generated DB types are up to date
        run: |
          if ! git diff --exit-code src/types/database.ts; then
            echo "::error file=src/types/database.ts::DB types are out of date. Run 'npm run db:reset && npm run db:types' and commit src/types/database.ts."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Stiva locală completă (Auth, Mailpit, Edge Runtime, API); fără Studio și celelalte servicii de care testele nu au nevoie.
      - run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor
      # Fără nume, `functions serve` pornește toate funcțiile din `supabase/functions`. `invite` trimite emailul în Mailpit (nu prin Resend); rețeaua
      # Docker a stivei vede containerul lui. `timeline-share` și `rsvp` nu au nevoie de configurare (fără TURNSTILE_SECRET_KEY, verificarea Turnstile e sărită), dar așteptăm și după ele.
      - name: Serve the Edge Functions
        run: |
          printf 'INVITE_MAILPIT_URL=http://supabase_inbucket_nunta-start:8025\nSITE_URL=http://localhost:5173\n' > "$RUNNER_TEMP/invite.env"
          npx supabase functions serve --env-file "$RUNNER_TEMP/invite.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          for _ in $(seq 60); do
            invite=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/invite)
            share=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/timeline-share)
            rsvp=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/rsvp)
            [ "$invite$share$rsvp" = 200200200 ] && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/functions.log"
          exit 1
      - name: Point the app at the local stack
        run: |
          eval "$(npx supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  migrations-plan:
    # Doar citire: fără secrete, fără acces la cloud. Migrațiile se aplică doar
    # după merge, de deploy.yml (staging automat, producție după aprobare).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check migrations
        run: scripts/check-migrations.sh origin/main
